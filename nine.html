<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>AWS SAP 문제풀기</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#1c1c1a;--surface:#2a2a28;--border:#3a3a38;--border-strong:#4a4a48;
  --text:#f0f0ee;--text2:#a0a09c;--text3:#606060;
  --accent:#2563eb;--accent-bg:#1e2d4a;--accent-border:#3b5bdb;
  --success:#16a34a;--success-bg:#0f2a1a;--success-border:#166534;
  --danger:#dc2626;--danger-bg:#2a1010;--danger-border:#991b1b;
  --radius:10px;
}
html,body{height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Arial,sans-serif;color:var(--text)}
body{display:flex;flex-direction:column;align-items:center;padding:0}
#wrap{width:100%;max-width:480px;padding:16px;display:flex;flex-direction:column;gap:14px;min-height:100svh}
.screen{display:none;flex-direction:column;gap:14px}
.screen.active{display:flex}
.hidden{display:none!important}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}

/* 홈 카드 내부 스타일 */
.card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:10px}
.input-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.input-label{font-size:14px;color:var(--text)}
.input-field{width:80px;padding:8px 10px;background:var(--bg);border:1px solid var(--border-strong);border-radius:8px;color:var(--text);font-size:15px;text-align:right}

.toggle-row{display:flex;align-items:center;gap:16px;margin-top:6px}
.toggle-label{display:flex;align-items:center;gap:7px;font-size:14px;color:var(--text);cursor:pointer}
.toggle-label input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}

.btn{width:100%;padding:14px;border-radius:var(--radius);border:none;font-size:16px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .1s;font-family:inherit}
.btn:active{transform:scale(0.98)}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border-strong)}
.btn-danger-outline{background:transparent;color:#f87171;border:1px solid #7f1d1d}

.btn-row{display:flex;gap:8px}
.btn-copy-wrap{flex:1}
.btn-action-wrap{flex:3}

.prog-wrap{display:flex;flex-direction:column;gap:6px}
.prog-bar{height:6px;background:var(--border);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .3s ease}
.prog-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--text2)}

.q-num{font-size:13px;font-weight:600;color:var(--accent);margin-bottom:8px}
.q-text{font-size:18px;font-weight:600;color:var(--text);line-height:1.55}
.q-hint{font-size:13px;color:var(--text2);margin-top:7px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--radius);cursor:pointer;background:var(--surface);transition:border-color .12s,background .12s;user-select:none}
.opt:hover{border-color:var(--border-strong)}
.opt.sel{border-color:var(--accent);background:var(--accent-bg)}
.opt.ok{border-color:var(--success-border);background:var(--success-bg)}
.opt.ng{border-color:var(--danger-border);background:var(--danger-bg)}
.opt-num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:600;color:var(--text2);margin-top:1px}
.opt.sel .opt-num{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.ok .opt-num{background:var(--success);border-color:var(--success);color:#fff}
.opt.ng .opt-num{background:var(--danger);border-color:var(--danger);color:#fff}
.opt-text{font-size:16px;color:var(--text);line-height:1.5}
.opt.ok .opt-text{color:#4ade80}
.opt.ng .opt-text{color:#f87171}

.feedback{padding:11px 14px;border-radius:var(--radius);font-size:14px;line-height:1.5;display:none}
.feedback.ok{display:block;background:var(--success-bg);color:#4ade80;border:1px solid var(--success-border)}
.feedback.ng{display:block;background:var(--danger-bg);color:#f87171;border:1px solid var(--danger-border)}

.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
.stat-val{font-size:28px;font-weight:700;color:var(--text)}
.stat-val.accent{color:var(--accent)}
.stat-lbl{font-size:13px;color:var(--text2);margin-top:3px}

.reset-box{border:1px dashed #7f1d1d;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.reset-title{font-size:13px;font-weight:700;color:#f87171}

.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.topbar-title{font-size:18px;font-weight:700;color:var(--text)}
.topbar-back{font-size:14px;color:var(--accent);cursor:pointer;padding:4px 0}
</style>
</head>
<body>
<div id="wrap">

  <!-- HOME -->
  <div class="screen active" id="s-home">
    <div class="topbar">
      <span class="topbar-title">AWS SAP 문제풀기</span>
      <span class="badge" id="total-badge">707문제</span>
    </div>

    <!-- 전체 학습 진행률 -->
    <div class="card">
      <div class="card-title">전체 학습 진행률</div>
      <div class="prog-wrap">
        <div class="prog-bar"><div class="prog-fill" id="home-prog-fill"></div></div>
        <div class="prog-meta">
          <span id="home-prog-txt">0 / 707 완료</span>
          <span id="home-prog-pct">0%</span>
        </div>
      </div>
    </div>

    <!-- 이어서 풀기 전용 버튼 (세션이 있을 때만 표시) -->
    <div id="continue-wrap" class="hidden">
      <button class="btn btn-primary" style="background:#059669;" id="btn-continue" onclick="continueQuiz()">이어서 풀기</button>
    </div>

    <!-- 세션 설정 카드 -->
    <div class="card">
      <div class="card-title">새 세션 설정</div>
      <div class="input-row">
        <span class="input-label" id="lbl-start-num">시작 문제 번호 (1 ~ 707)</span>
        <input type="number" id="inp-start" class="input-field" value="1" min="1" max="707">
      </div>
      <div class="input-row">
        <span class="input-label">세션당 문제 수</span>
        <input type="number" id="inp-count" class="input-field" value="10" min="1" max="707">
      </div>
      <div class="toggle-row">
        <label class="toggle-label"><input type="checkbox" id="chk-instant" checked>즉시 정오답 확인</label>
        <label class="toggle-label"><input type="checkbox" id="chk-random">랜덤 출제</label>
      </div>
    </div>

    <button class="btn btn-secondary" id="btn-start-new" onclick="startQuiz()">새 세션 시작하기</button>

    <div id="missed-start-wrap" class="hidden">
      <button class="btn btn-secondary" id="btn-missed-start" onclick="startMissedOnly()">오답만 풀기 (<span id="missed-count">0</span>문제)</button>
    </div>

    <!-- 초기화 메뉴 -->
    <div class="reset-box">
      <div class="reset-title">초기화 메뉴</div>
      <div class="btn-row">
        <button class="btn btn-secondary" style="flex:1" onclick="resetCurrentSession()">세션 초기화</button>
        <button class="btn btn-danger-outline" style="flex:1" onclick="resetAllProgress()">전체 기록 초기화</button>
      </div>
    </div>
  </div>

  <!-- QUIZ -->
  <div class="screen" id="s-quiz">
    <div class="topbar">
      <span class="topbar-back" onclick="showHome()">이전 화면</span>
      <span id="score-live" style="font-size:14px;color:var(--text2)"></span>
    </div>
    <div class="prog-wrap">
      <div class="prog-bar"><div class="prog-fill" id="prog-fill"></div></div>
      <div class="prog-meta"><span id="prog-txt"></span><span id="prog-pct"></span></div>
    </div>
    <div class="card">
      <div class="q-num" id="q-num"></div>
      <div class="q-text" id="q-text"></div>
      <div class="q-hint" id="q-hint"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="fb"></div>
    
    <!-- 1:3 비율 하단 버튼 -->
    <div class="btn-row">
      <div class="btn-copy-wrap">
        <button class="btn btn-secondary" id="btn-copy" onclick="copyToClipboard()">복사</button>
      </div>
      <div class="btn-action-wrap">
        <button class="btn btn-primary" id="btn-check" onclick="checkAnswer()" disabled>확인</button>
        <button class="btn btn-primary hidden" id="btn-next" onclick="nextQ()">다음</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <div class="screen" id="s-result">
    <div class="topbar"><span class="topbar-title">결과</span></div>
    <div class="stat-grid">
      <div class="stat"><div class="stat-val accent" id="r-score"></div><div class="stat-lbl">점수</div></div>
      <div class="stat"><div class="stat-val accent" id="r-pct"></div><div class="stat-lbl">정답률</div></div>
      <div class="stat"><div class="stat-val" id="r-ok"></div><div class="stat-lbl">정답</div></div>
      <div class="stat"><div class="stat-val" id="r-ng"></div><div class="stat-lbl">오답</div></div>
    </div>
    <div class="btn-row" style="margin-top:10px">
      <button class="btn btn-secondary" onclick="showHome()">홈으로</button>
      <button class="btn btn-primary" id="btn-retry" onclick="retryMissed()">오답만 다시풀기</button>
    </div>
  </div>

</div>

<!-- external question data -->
<script src="questions.js"></script>

<script>
var STATS_KEY = 'aws_sap_stats';
var SESSION_KEY = 'aws_sap_session';
var MISSED_KEY = 'aws_sap_missed';

var activeSession = null;
var selectedOpts = [];

function getStats() {
  var raw = localStorage.getItem(STATS_KEY);
  return raw ? JSON.parse(raw) : {};
}

function saveStats(stats) {
  localStorage.setItem(STATS_KEY, JSON.stringify(stats));
}

function getMissedIndices() {
  var raw = localStorage.getItem(MISSED_KEY);
  return raw ? JSON.parse(raw) : [];
}

function saveMissedIndices(list) {
  localStorage.setItem(MISSED_KEY, JSON.stringify(list));
}

function addMissed(qIdx) {
  var list = getMissedIndices();
  if (list.indexOf(qIdx) === -1) {
    list.push(qIdx);
    saveMissedIndices(list);
  }
}

function removeMissed(qIdx) {
  var list = getMissedIndices();
  var idx = list.indexOf(qIdx);
  if (idx !== -1) {
    list.splice(idx, 1);
    saveMissedIndices(list);
  }
}

// ★ 세션 저장 함수 (normal 모드일 때만 로컬스토리지에 저장)
function saveSession() {
  if (activeSession && activeSession.mode === 'normal') {
    localStorage.setItem(SESSION_KEY, JSON.stringify(activeSession));
  }
}

function showHome() {
  // ★ 이전 화면 눌러서 홈으로 올 때, 현재 퀴즈 풀이 상태가 있다면 즉시 로컬스토리지에 보존
  saveSession();

  document.querySelectorAll('.screen').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('s-home').classList.add('active');
  
  var totalCount = (typeof ALL_Q !== 'undefined') ? ALL_Q.length : 0;
  document.getElementById('total-badge').innerText = totalCount + '문제';
  document.getElementById('lbl-start-num').innerText = '시작 문제 번호 (1 ~ ' + totalCount + ')';
  document.getElementById('inp-start').max = totalCount;
  document.getElementById('inp-count').max = totalCount;

  // 전체 학습 진행률 계산
  var stats = getStats();
  var solvedCount = Object.keys(stats).length;
  var pct = totalCount > 0 ? Math.round((solvedCount / totalCount) * 100) : 0;
  
  document.getElementById('home-prog-fill').style.width = pct + '%';
  document.getElementById('home-prog-txt').innerText = solvedCount + ' / ' + totalCount + ' 완료';
  document.getElementById('home-prog-pct').innerText = pct + '%';

  // 오답 목록
  var missed = getMissedIndices();
  var missedWrap = document.getElementById('missed-start-wrap');
  if (missed.length > 0) {
    missedWrap.classList.remove('hidden');
    document.getElementById('missed-count').innerText = missed.length;
  } else {
    missedWrap.classList.add('hidden');
  }

  // ★ 저장된 정주행 세션 존재 시 [이어서 풀기] 초록색 버튼 노출
  var saved = localStorage.getItem(SESSION_KEY);
  var continueWrap = document.getElementById('continue-wrap');
  if (saved) {
    var savedSession = JSON.parse(saved);
    if (savedSession && savedSession.cur < savedSession.qIndices.length) {
      continueWrap.classList.remove('hidden');
      var realQNum = savedSession.qIndices[savedSession.cur] + 1;
      document.getElementById('btn-continue').innerText = '이어서 풀기 (현재 ' + realQNum + '번 / ' + (savedSession.cur + 1) + '번째 진행 중)';
    } else {
      continueWrap.classList.add('hidden');
    }
  } else {
    continueWrap.classList.add('hidden');
  }
}

// 이어서 풀기 버튼
function continueQuiz() {
  var saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    activeSession = JSON.parse(saved);
    renderQuiz();
  }
}

// 새 세션 시작
function startQuiz() {
  var saved = localStorage.getItem(SESSION_KEY);
  if (saved) {
    if (!confirm('진행 중이던 기존 세션이 삭제되고 새 세션이 시작됩니다. 계속하시겠습니까?')) {
      return;
    }
  }

  var total = ALL_Q.length;
  var start = parseInt(document.getElementById('inp-start').value, 10) - 1;
  var count = parseInt(document.getElementById('inp-count').value, 10);
  var isRandom = document.getElementById('chk-random').checked;
  var isInstant = document.getElementById('chk-instant').checked;

  if (isNaN(start) || start < 0) start = 0;
  if (start >= total) start = total - 1;
  if (isNaN(count) || count < 1) count = 20;

  var indices = [];
  if (isRandom) {
    for (var i = 0; i < total; i++) indices.push(i);
    for (var i = indices.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = indices[i];
      indices[i] = indices[j];
      indices[j] = temp;
    }
    indices = indices.slice(0, count);
  } else {
    var end = Math.min(start + count, total);
    for (var i = start; i < end; i++) indices.push(i);
  }

  activeSession = {
    mode: 'normal',
    qIndices: indices,
    cur: 0,
    score: 0,
    instant: isInstant,
    userAnswers: {}
  };

  saveSession();
  renderQuiz();
}

function startMissedOnly() {
  var missed = getMissedIndices();
  if (missed.length === 0) return;

  var isInstant = document.getElementById('chk-instant').checked;

  // 오답노트는 'missed' 모드로 정주행 세션 스토리지에 절대로 영향을 주지 않음
  activeSession = {
    mode: 'missed',
    qIndices: missed,
    cur: 0,
    score: 0,
    instant: isInstant,
    userAnswers: {}
  };

  renderQuiz();
}

function renderQuiz() {
  document.querySelectorAll('.screen').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('s-quiz').classList.add('active');

  var qIdx = activeSession.qIndices[activeSession.cur];
  var q = ALL_Q[qIdx];

  var total = activeSession.qIndices.length;
  var curNum = activeSession.cur + 1;
  var pct = Math.round(((curNum - 1) / total) * 100);

  document.getElementById('prog-fill').style.width = pct + '%';
  document.getElementById('prog-txt').innerText = curNum + ' / ' + total + ' 문제';
  document.getElementById('prog-pct').innerText = (activeSession.mode === 'missed' ? '[오답노트] ' : '') + pct + '% 진행';

  document.getElementById('q-num').innerText = '문제 ' + (qIdx + 1);
  document.getElementById('q-text').innerText = q.q;

  var reqCount = q.answers.length;
  document.getElementById('q-hint').innerText = reqCount > 1 ? '(다중 선택 가능: ' + reqCount + '개 선택)' : '(단일 선택)';

  var optsHtml = '';
  q.opts.forEach(function(optText, i) {
    optsHtml += '<div class="opt" onclick="selectOpt(' + i + ')" id="opt-' + i + '">' +
                '<div class="opt-num">' + String.fromCharCode(65 + i) + '</div>' +
                '<div class="opt-text">' + optText + '</div>' +
                '</div>';
  });
  document.getElementById('opts').innerHTML = optsHtml;

  var fb = document.getElementById('fb');
  fb.className = 'feedback';
  fb.style.display = 'none';

  selectedOpts = [];
  document.getElementById('btn-check').disabled = true;
  document.getElementById('btn-check').classList.remove('hidden');
  document.getElementById('btn-next').classList.add('hidden');
}

function selectOpt(idx) {
  var qIdx = activeSession.qIndices[activeSession.cur];
  var q = ALL_Q[qIdx];
  var maxSel = q.answers.length;

  var pos = selectedOpts.indexOf(idx);
  if (pos !== -1) {
    selectedOpts.splice(pos, 1);
  } else {
    if (maxSel === 1) {
      selectedOpts = [idx];
    } else {
      if (selectedOpts.length < maxSel) {
        selectedOpts.push(idx);
      }
    }
  }

  for (var i = 0; i < q.opts.length; i++) {
    var el = document.getElementById('opt-' + i);
    if (selectedOpts.indexOf(i) !== -1) {
      el.classList.add('sel');
    } else {
      el.classList.remove('sel');
    }
  }

  document.getElementById('btn-check').disabled = (selectedOpts.length !== maxSel);
}

function checkAnswer() {
  var qIdx = activeSession.qIndices[activeSession.cur];
  var q = ALL_Q[qIdx];

  var isCorrect = true;
  if (selectedOpts.length !== q.answers.length) {
    isCorrect = false;
  } else {
    var sortedSel = selectedOpts.slice().sort();
    var sortedAns = q.answers.slice().sort();
    for (var i = 0; i < sortedAns.length; i++) {
      if (sortedSel[i] !== sortedAns[i]) {
        isCorrect = false;
        break;
      }
    }
  }

  var stats = getStats();
  stats[qIdx] = isCorrect;
  saveStats(stats);

  if (isCorrect) {
    activeSession.score++;
    removeMissed(qIdx);
  } else {
    addMissed(qIdx);
  }

  // ★ 정/오답 판정 시점마다 정주행 세션 상태 로컬스토리지에 최신화
  saveSession();

  if (activeSession.instant) {
    for (var i = 0; i < q.opts.length; i++) {
      var el = document.getElementById('opt-' + i);
      el.onclick = null;
      var isTargetAns = q.answers.indexOf(i) !== -1;
      var isUserSel = selectedOpts.indexOf(i) !== -1;

      if (isTargetAns) {
        el.classList.add('ok');
      } else if (isUserSel) {
        el.classList.add('ng');
      }
    }

    var fb = document.getElementById('fb');
    if (isCorrect) {
      fb.innerText = '정답입니다!';
      fb.className = 'feedback ok';
    } else {
      var ansText = q.answers.map(function(a) { return String.fromCharCode(65 + a); }).join(', ');
      fb.innerText = '오답입니다. 정답: ' + ansText;
      fb.className = 'feedback ng';
    }

    document.getElementById('btn-check').classList.add('hidden');
    document.getElementById('btn-next').classList.remove('hidden');
  } else {
    nextQ();
  }
}

function nextQ() {
  activeSession.cur++;
  saveSession(); // 다음 문제 넘어가면 cur 번호 보존

  if (activeSession.cur < activeSession.qIndices.length) {
    renderQuiz();
  } else {
    showResult();
  }
}

function showResult() {
  document.querySelectorAll('.screen').forEach(function(el) { el.classList.remove('active'); });
  document.getElementById('s-result').classList.add('active');

  var total = activeSession.qIndices.length;
  var score = activeSession.score;
  var pct = Math.round((score / total) * 100);

  document.getElementById('r-score').innerText = score + ' / ' + total;
  document.getElementById('r-pct').innerText = pct + '%';
  document.getElementById('r-ok').innerText = score;
  document.getElementById('r-ng').innerText = total - score;

  // 세션이 완전히 끝나야만 세션 데이터 삭제
  if (activeSession.mode === 'normal') {
    localStorage.removeItem(SESSION_KEY);
  }
}

function retryMissed() {
  startMissedOnly();
}

function resetCurrentSession() {
  if (confirm('현재 진행중인 정주행 세션을 초기화하시겠습니까?')) {
    localStorage.removeItem(SESSION_KEY);
    activeSession = null;
    showHome();
  }
}

function resetAllProgress() {
  if (confirm('경고: 전체 학습 기록 및 오답 목록이 완전히 삭제됩니다. 진행하시겠습니까?')) {
    localStorage.removeItem(STATS_KEY);
    localStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(MISSED_KEY);
    activeSession = null;
    showHome();
  }
}

function copyToClipboard() {
  if (!activeSession) return;
  var qIdx = activeSession.qIndices[activeSession.cur];
  var q = ALL_Q[qIdx];
  
  // 1. 문제 헤더 및 본문 작성
  var text = '[AWS SAP 문제 ' + (qIdx + 1) + '번]\n' + q.q + '\n\n';

  // 2. 보기(A, B, C, D...) 추가
  if (q.opts && q.opts.length > 0) {
    q.opts.forEach(function(optText, i) {
      var letter = String.fromCharCode(65 + i); // 0 -> A, 1 -> B, 2 -> C...
      text += letter + '. ' + optText + '\n';
    });
  }

  // 3. 클립보드 복사 실행
  navigator.clipboard.writeText(text.trim()).then(function() {
    alert('문제와 보기가 복사되었습니다.');
  }).catch(function() {
    alert('복사에 실패했습니다.');
  });
}


showHome();
</script>
